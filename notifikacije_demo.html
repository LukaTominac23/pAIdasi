
<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tutor - Demo notifikacija</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .notif-area {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 1000;
        }

        .notif {
            background: white;
            border-radius: 12px;
            box-shadow: 0 6px 25px rgba(0,0,0,0.15);
            padding: 16px 20px;
            width: 320px;
            display: flex;
            gap: 14px;
            align-items: flex-start;
            opacity: 0;
            transform: translateX(40px);
            transition: all 0.35s ease;
            border-left: 5px solid #1565c0;
        }

        .notif.show {
            opacity: 1;
            transform: translateX(0);
        }

        .notif .icon {
            font-size: 28px;
            line-height: 1;
        }

        .notif .text h4 {
            margin: 0 0 4px 0;
            font-size: 15px;
            color: #0f172a;
        }

        .notif .text p {
            margin: 0;
            font-size: 13px;
            color: #64748b;
        }

        .notif.warning { border-left-color: #f59e0b; }
        .notif.danger  { border-left-color: #b91c1c; }
        .notif.success { border-left-color: #15803d; }

        .demo-box {
            margin-top: 30px;
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            max-width: 500px;
        }
    </style>
</head>
<body>

<div class="sidebar">
    <h2>AI Tutor</h2>
    <a href="main.html" class="menu-btn">🏠 Početna</a>
    <a href="dodaj_obavezu.html" class="menu-btn">➕ Dodaj obavezu</a>
    <a href="obaveze.php" class="menu-btn">📋 Moje obaveze</a>
    <a href="napredak_mobile.html" class="menu-btn">📈 Napredak</a>
</div>

<div class="content">

    <h1>Demo notifikacija</h1>

    <div class="demo-box">
        <p>Klikom na gumb prikazat će se primjeri notifikacija koje AI Tutor šalje korisniku.</p>
        <br>
        <button class="btn" onclick="prikaziNotifikacije()" style="border:none; cursor:pointer; font-size:15px;">
            🔔 Prikaži notifikacije
        </button>
    </div>

</div>

<div class="notif-area" id="notifArea"></div>

<script>
const notifikacije = [
    {
        tip: "",
        icon: "⏰",
        naslov: "Ispit se približava",
        tekst: "Baze podataka - ispit za 3 dana. Vrijeme je za zadnju pripremu!"
    },
    {
        tip: "danger",
        icon: "⚠️",
        naslov: "Kasniš s gradivom",
        tekst: "Engleski jezik - esej je trebao biti gotov prije 2 dana."
    },
    {
        tip: "success",
        icon: "✅",
        naslov: "Gradivo savladano",
        tekst: "XML - xPath naučen dovoljno za ocjenu 4!"
    }
];

function prikaziNotifikacije() {
    const area = document.getElementById("notifArea");
    area.innerHTML = "";

    notifikacije.forEach((n, i) => {
        setTimeout(() => {
            const el = document.createElement("div");
            el.className = "notif " + n.tip;
            el.innerHTML = `
                <div class="icon">${n.icon}</div>
                <div class="text">
                    <h4>${n.naslov}</h4>
                    <p>${n.tekst}</p>
                </div>
            `;
            area.appendChild(el);

            requestAnimationFrame(() => el.classList.add("show"));

            setTimeout(() => {
                el.classList.remove("show");
                setTimeout(() => el.remove(), 350);
            }, 5000);
        }, i * 800);
    });
}
</script>

</body>
</html>
