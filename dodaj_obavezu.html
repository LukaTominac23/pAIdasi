<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <title>Dodaj obavezu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="form-container">

    <h1>Dodaj novu obavezu</h1>

    <form action="spremi.php" method="POST">

        <label>Predmet</label>
        <input type="text" name="predmet" required>

        <label>Datum ispita</label>
        <input type="date" name="datum" required>

        <label>Težina gradiva (1-5)</label>
        <select name="tezina">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
        </select>

        <label>Željena ocjena</label>
        <select name="ocjena">
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
        </select>

        <button type="submit">
            Spremi obavezu
        </button>

    </form>

    <br>

    <a href="main.html">← Povratak na početnu</a>

</div>

</body>
</html>
